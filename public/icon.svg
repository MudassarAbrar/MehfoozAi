<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BB5F0" />
      <stop offset="100%" stop-color="#4A90D9" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Sky-blue rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#skyBg)" />

  <!-- Sun (behind cloud) -->
  <circle cx="320" cy="176" r="72" fill="#FFD93D" />
  <circle cx="320" cy="176" r="56" fill="#FFE066" />

  <!-- Cloud -->
  <g filter="url(#softGlow)">
    <circle cx="210" cy="260" r="64" fill="white" />
    <circle cx="280" cy="240" r="72" fill="white" />
    <circle cx="340" cy="268" r="52" fill="white" />
    <rect x="178" y="260" width="200" height="64" rx="8" fill="white" />
  </g>

  <!-- Raindrops -->
  <g opacity="0.7">
    <ellipse cx="220" cy="370" rx="6" ry="14" fill="#B8D8F8" />
    <ellipse cx="270" cy="390" rx="6" ry="14" fill="#B8D8F8" />
    <ellipse cx="320" cy="374" rx="6" ry="14" fill="#B8D8F8" />
  </g>
</svg>
